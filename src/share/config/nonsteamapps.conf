# NonSteamApps settings. Changes apply the next time an app starts.

# Separate sign-ins and data in every app for each Steam account (1), or one
# set shared by all accounts and by the apps' own menu entries (0).
PROFILE_PER_STEAM_ACCOUNT=1

# The Steam library collection that holds every app NonSteamApps adds, in each
# Steam account. Leave it empty for no collection.
STEAM_COLLECTION=NonSteamApps

# Steam artwork drawn on this device around each app's own icon (1): the icon
# its Flatpak, release or project ships, or the one its site names, so that the
# library shows the icons you know. 0 keeps NonSteamApps' own artwork for every
# app. Helium draws it at each install and update, once the icon changes.
APP_ICONS=1

# Helium apps (Helium, Prime Video, HBO Max, Netflix, Disney+, ProtonDB).
# Helium's services download Widevine, which the streaming apps need to play
# anything, and keep its ad blocker's filter lists current (1), or stay off (0).
HELIUM_SERVICES=1

# Interface scale for the Helium apps, YouTube, Element, Signal, Bitwarden,
# Jellyfin, LocalSend, Prism Launcher, the game lists of Eden, Eden-NX2 and
# Lichii, KytyPS5's launcher, ProtonUp-Qt, Protontricks and Files: auto sizes
# them for a TV in Game Mode (1.5 at 1080p, 3 at 4K; YouTube 2 at 4K, to fit its
# 1080p TV layout), a number such as 1.5 sets the scale, and 1 turns it off.
# LocalSend only scales by whole numbers, from 2; below 2, Protontricks scales
# only its text. This replaces HELIUM_SCALE, which is still read.
TV_SCALE=auto

# YouTube (VacuumTube) turns Chromium's sandbox off in Game Mode, because its
# developer found it would not start there otherwise. Set 1 to keep the sandbox
# on: safer, but not yet confirmed on a Steam Deck. If YouTube then does not
# start in Game Mode, set it back to 0.
GAME_MODE_SANDBOX=0

# The Switch in Eden, Eden-NX2 and Lichii runs docked or handheld. auto chooses
# in Game Mode: docked when Steam runs the emulator at 1000 pixels tall or more,
# as at Native resolution on a TV, and handheld below that, as on a Steam Deck's
# screen; in Desktop Mode, the emulator's own choice stays. docked or handheld
# sets it for every start from Steam, and off leaves it to the emulator. A
# game's own Console Mode, in its properties, still wins.
EDEN_CONSOLE_MODE=auto

# While a non-Steam game runs, Steam shows friends "In non-Steam game" and its
# name, and its Mark as Private does not work for non-Steam games. all makes
# your Steam account invisible while any NonSteamApps app that Steam started
# runs, and sets back your status, Online or Away, once the last one closes:
# friends see you offline meanwhile, and chat still works. List app IDs, such
# as "eden edennx2 kytyps5", for only those apps, or set off to leave your
# status alone. An account already Invisible or Offline stays as it is.
INVISIBLE_WHILE_RUNNING=all
