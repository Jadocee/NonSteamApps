name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v

      - name: ShellCheck
        run: shellcheck -x -P SCRIPTDIR install.sh uninstall.sh src/bin/nonsteamapps tests/sandbox.sh tests/fakes/sudo tests/fakes/dolphin src/share/sandbox/xdg-open src/share/kytyps5/terminal tests/containers/*.sh tests/containers/steamos/*.sh

      - name: Artwork tool
        run: python3 -m py_compile tools/render-artwork.py

      - name: Install, launch and uninstall in a sandbox
        run: tests/sandbox.sh
